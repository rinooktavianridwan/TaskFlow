syntax = "proto3";

// 1. Tambahkan suffix versi (.v1) sesuai aturan Buf
package notification.v1;

option go_package = "go-notification-service/pb/notification/v1;v1";

service NotificationService {
  rpc SendVerificationEmail(SendVerificationEmailRequest) returns (SendVerificationEmailResponse);
  rpc SendInvitationEmail(SendInvitationEmailRequest) returns (SendInvitationEmailResponse);
  rpc ScheduleTaskReminder(ScheduleTaskReminderRequest) returns (ScheduleTaskReminderResponse);
  rpc CancelTaskReminder(CancelTaskReminderRequest) returns (CancelTaskReminderResponse);
}

// ==========================================
// PAYLOAD: VERIFICATION
// ==========================================
message SendVerificationEmailRequest {
  int64 user_id = 1;
  string name = 2;
  string email = 3;
  string token = 4;
}

message SendVerificationEmailResponse {
  bool success = 1;
  string message = 2;
}

// ==========================================
// PAYLOAD: INVITATION
// ==========================================
message SendInvitationEmailRequest {
  int64 project_id = 1;
  string project_name = 2;
  string target_email = 3;
  string token = 4;
}

message SendInvitationEmailResponse {
  bool success = 1;
  string message = 2;
}

// ==========================================
// PAYLOAD: REMINDER
// ==========================================
message ScheduleTaskReminderRequest {
  int64 task_id = 1;
  string task_title = 2;
  string project_name = 3;
  string assignee_email = 4;
  // RFC3339 UTC, contoh: 2026-10-02T12:00:00Z
  string due_date = 5;
}

message ScheduleTaskReminderResponse {
  bool success = 1;
  string message = 2;
}

message CancelTaskReminderRequest {
  int64 task_id = 1;
}

message CancelTaskReminderResponse {
  bool success = 1;
  string message = 2;
}
